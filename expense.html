<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý chi tiêu – Nhánh Nhì Họ Ngô Tá</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="sub-header">
    <h1>Quản lý Tài Chính</h1>
    <nav aria-label="Điều hướng chính">
      <a href="index.html">Trang Chủ</a>
      <a href="list.html">Đóng Tiền Chạp</a>
      <a href="list-san.html">Ủng Hộ Làm Sân</a>
      <a href="list-ho.html">Đóng Tiền Họ</a>
      <a href="expense.html" class="active" aria-current="page">Tài Chính</a>
    </nav>
  </header>

  <main>

    <!-- TỔNG QUAN -->
    <div class="finance-summary">
      <div class="summary-box income">
        <h3>Tiền Thu</h3>
        <p class="amount" id="total-income">0 đ</p>
      </div>

      <div class="summary-box expense">
        <h3>Tiền Chi</h3>
        <p class="amount" id="total-expense">0 đ</p>
      </div>

      <div class="summary-box balance">
        <h3>Tiền Còn Lại</h3>
        <p class="amount" id="total-balance">0 đ</p>
      </div>
    </div>

    <!-- CHI TIẾT TIỀN THU -->
    <section class="section income-detail">
      <h2>Chi tiết Tiền Thu</h2>
      <div class="income-breakdown" id="income-breakdown"></div>
    </section>

    <!-- CHI TIẾT TIỀN CHI -->
    <section class="section">
      <h2>Chi tiết Tiền Chi</h2>
      <div id="expense-container" class="expense-container"></div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Nhánh Nhì Họ Ngô Tá</p>
  </footer>

  <script>
    // Income sources that are computed by summing a contributor list.
    const INCOME_LISTS = [
      { label: "Tiền Con Cháu Nội", url: "data.json" },
      { label: "Tiền Ủng Hộ Làm Sân", url: "data-san.json" },
      { label: "Tiền Đóng Họ", url: "data-ho.json" }
    ];

    const state = {
      totalIncomeVND: 0,
      totalIncomeUSD: 0,
      totalExpenseVND: 0,
      totalExpenseUSD: 0
    };

    function formatCurrency(vnd, usd = 0) {
      if (vnd > 0 && usd > 0) return `${vnd.toLocaleString('vi-VN')} đ + ${usd} USD`;
      if (vnd > 0) return `${vnd.toLocaleString('vi-VN')} đ`;
      if (usd > 0) return `${usd} USD`;
      return "0";
    }

    function formatAmount(value, currency) {
      return currency === "USD" ? `${value} USD` : `${value.toLocaleString('vi-VN')} đ`;
    }

    function fetchJson(url) {
      return fetch(url).then(res => {
        if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
        return res.json();
      });
    }

    function sumMoney(rows) {
      return rows.reduce((sum, row) => sum + (Number.isFinite(row.money) ? row.money : 0), 0);
    }

    function updateAllDisplays() {
      document.getElementById("total-income").textContent  = formatCurrency(state.totalIncomeVND, state.totalIncomeUSD);
      document.getElementById("total-expense").textContent = formatCurrency(state.totalExpenseVND, state.totalExpenseUSD);

      const balanceVND = state.totalIncomeVND - state.totalExpenseVND;
      const balanceUSD = state.totalIncomeUSD - state.totalExpenseUSD;
      document.getElementById("total-balance").textContent = formatCurrency(balanceVND, balanceUSD);
    }

    function renderIncomeBreakdown(rows) {
      const fragment = document.createDocumentFragment();

      rows.forEach(row => {
        const item = document.createElement("div");
        item.className = "breakdown-item";

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = `${row.label}:`;

        const value = document.createElement("span");
        value.className = "value";
        value.textContent = formatAmount(row.value, row.currency);

        item.append(label, value);
        fragment.appendChild(item);
      });

      document.getElementById("income-breakdown").replaceChildren(fragment);
    }

    function renderExpenses(categories) {
      state.totalExpenseVND = 0;
      state.totalExpenseUSD = 0;
      const fragment = document.createDocumentFragment();

      categories.forEach(cat => {
        let catVND = 0;
        let catUSD = 0;

        const items = document.createElement("div");
        items.className = "expense-items";

        cat.items.forEach(item => {
          const amount = Number.isFinite(item.amount) ? item.amount : 0;
          if (item.currency === "USD") {
            state.totalExpenseUSD += amount;
            catUSD += amount;
          } else {
            state.totalExpenseVND += amount;
            catVND += amount;
          }

          const row = document.createElement("div");
          row.className = "expense-item";

          const name = document.createElement("span");
          name.className = "expense-name";
          name.textContent = item.name;

          const value = document.createElement("span");
          value.className = "expense-amount";
          value.textContent = `${amount.toLocaleString('vi-VN')} ${item.currency}`;

          row.append(name, value);
          items.appendChild(row);
        });

        const title = document.createElement("h3");
        title.textContent = cat.category;

        const total = document.createElement("div");
        total.className = "category-total";
        const totalValue = document.createElement("strong");
        totalValue.textContent = formatCurrency(catVND, catUSD);
        total.append("Tổng: ", totalValue);

        const box = document.createElement("div");
        box.className = "expense-category";
        box.append(title, items, total);
        fragment.appendChild(box);
      });

      document.getElementById("expense-container").replaceChildren(fragment);
    }

    async function loadFinanceData() {
      try {
        const [listData, otherIncome, expenseData] = await Promise.all([
          Promise.all(INCOME_LISTS.map(source => fetchJson(source.url))),
          fetchJson("income-other.json"),
          fetchJson("expense-data.json")
        ]);

        const breakdown = [
          ...INCOME_LISTS.map((source, i) => ({
            label: source.label,
            value: sumMoney(listData[i]),
            currency: "đ"
          })),
          ...otherIncome.map(row => ({
            label: row.name,
            value: Number.isFinite(row.money) ? row.money : 0,
            currency: row.currency
          }))
        ];

        renderIncomeBreakdown(breakdown);

        state.totalIncomeVND = breakdown
          .filter(row => row.currency !== "USD")
          .reduce((sum, row) => sum + row.value, 0);
        state.totalIncomeUSD = breakdown
          .filter(row => row.currency === "USD")
          .reduce((sum, row) => sum + row.value, 0);

        renderExpenses(expenseData);
        updateAllDisplays();

      } catch (err) {
        // Surface the failure instead of leaving misleading zeros on screen
        console.error("Lỗi tải dữ liệu:", err);
        ["total-income", "total-expense", "total-balance"].forEach(id => {
          document.getElementById(id).textContent = "Lỗi tải dữ liệu";
        });
      }
    }

    document.addEventListener("DOMContentLoaded", loadFinanceData);
  </script>

</body>
</html>
